{%- assign site_info = site.data.site -%}
<footer class="site-footer">
  <div class="container site-footer__inner">
    <p>{{ site_info.legal_name }} {{ site_info.legal_form }} · SIRET {{ site_info.siret }}</p>
    <p><a href="{{ '/mentions-legales/' | relative_url }}">Mentions légales</a></p>
  </div>
</footer>
<nav class="call-bar" aria-label="Appeler ou écrire">
  <a class="call-bar__phone" href="tel:{{ site_info.phone_e164 }}">Appeler · {{ site_info.phone_display }}</a>
  <a class="call-bar__mail" href="mailto:{{ site_info.email }}">E-mail</a>
</nav>
